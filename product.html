        <div class="header__collapse" id="menu-collapse">

            <div

              <button
                class="header__link header__more-trigger"

                БІЛЬШЕ
                <svg
                  class="header__more-icon"

                  stroke="currentColor"

                  <path d="M6 9l6 6 6-6" />
                </svg>
              </button>
              <div class="header__more-menu">
                <a
                  href="products.html"

          <div class="header__utils">
            <div class="header__lang">

                <svg

              <ul class="header__lang-menu">

            <a

    <!-- MAIN DYNAMIC PRODUCT CONTAINER -->

    <!-- FOOTER -->

          </div>
          <div class="footer__item">
            <img

              alt="Contact Person"
              class="footer__icon"
            />

          </div>
          <div class="footer__item">
            <img
              src="assets/images/location.svg"

              class="footer__icon"
            />
            <span class="footer__text"
              >вул. Солом'янська, 5, Київ, Україна</span

          <div class="footer__item footer__item--align-top">
            <img
              src="assets/images/phone.svg"

            />
            <div class="footer__text-group">
              <a href="tel:+380504443355" class="footer__link"
                >+380 (50) 444-33-55</a
              >

                >+380 (44) 303-95-51</a
              >
            </div>
          </div>
          <div class="footer__item">
            <img
              src="assets/images/mail.svg"
              alt="Email"

            <a href="mailto:astelkom@gmail.com" class="footer__link"

        <div class="footer__map">

              />
              <source

              />
              <source

                srcset="assets/images/map-tablet.png"
              />

        </div>
      </div>
    </footer>
    <script src="js/products-data.js"></script>
    <script src="js/cart.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Mobile Menu Logic
        const toggleBtn = document.getElementById("menu-toggle");
        const collapseMenu = document.getElementById("menu-collapse");
        if (toggleBtn && collapseMenu) {
          toggleBtn.addEventListener("click", () => {
            collapseMenu.classList.toggle("header__collapse--open");
          });
        }

        // Render Dynamic Product
        const params = new URLSearchParams(window.location.search);
        const productId = params.get("id") || "com-900-485";
        const product = PRODUCTS_DATA[productId];
        const container = document.getElementById("product-container");

        if (!product) {
          container.innerHTML = `
            <div class="product-section" style="text-align: center; padding: 60px 24px;">
              <h1 class="product-hero__title" style="margin-bottom: 16px;">Товар не знайдено</h1>
              <p style="margin-bottom: 24px; color: #6b7280;">Перевірте посилання або поверніться до каталогу товарів.</p>
              <a href="products.html" class="btn-primary" style="max-width: 280px;">До каталогу</a>
            </div>
          `;
          return;
        }

        document.getElementById("page-title").textContent =
          `${product.title} — АСТЕЛ-КОМ`;

        // Gallery Images Array (falls back to single product.image)
        const galleryImages =
          product.images && product.images.length > 0
            ? product.images
            : [product.image];

        const thumbsHtml =
          galleryImages.length > 1
            ? `
            <div class="product-hero__thumbs" id="product-thumbs">
              ${galleryImages
                .map(
                  (imgSrc, idx) => `
                <button
                  type="button"
                  class="product-hero__thumb-btn ${idx === 0 ? "is-active" : ""}"
                  data-src="${imgSrc}"
                  aria-label="Фото ${idx + 1}"
                >
                  <img src="${imgSrc}" alt="${product.title} - фото ${idx + 1}" class="product-hero__thumb-img" />
                </button>
              `,
                )
                .join("")}
            </div>`
            : "";
        const renderTableRows = (rows) =>
          rows
            .map(
              (r) => `
              <tr>
                <th>${r.label}</th>
                <td>${r.value}</td>
              </tr>`,
            )
            .join("");

        const descriptionHtml = product.description
          .map((p) => `<p>${p}</p>`)
          .join("");

        const techSpecsSection =
          product.techSpecs && product.techSpecs.length
            ? `
          <section class="product-section">
            <h2 class="product-section__title">Технічні характеристики</h2>
            <table class="specs-table">
              <tbody>${renderTableRows(product.techSpecs)}</tbody>
            </table>
          </section>`
            : "";

        const generalSpecsSection =
          product.generalSpecs && product.generalSpecs.length
            ? `
          <section class="product-section">
            <h2 class="product-section__title">Основні характеристики</h2>
            <table class="specs-table">
              <tbody>${renderTableRows(product.generalSpecs)}</tbody>
            </table>
          </section>`
            : "";

        const docsSection =
          product.docs && product.docs.length
            ? `
          <section class="product-section">
            <h2 class="product-section__title">Специфікації та документація</h2>
            <div class="docs-list">
              ${product.docs
                .map(
                  (d) => `
                <a href="${d.url}" ${d.download ? `download="${d.download}"` : 'target="_blank" rel="noopener"'} class="doc-item">
                  <div class="doc-item__left">
                    <img src="assets/images/file_save.svg" alt="Завантажити" class="doc-item__icon" />
                    <span>${d.title}</span>
                  </div>
                  <span style="font-family: var(--font-mono); font-size: 13px; font-weight: 700;">${d.download ? "PDF" : "DRIVE"}</span>
                </a>`,
                )
                .join("")}
            </div>
          </section>`
            : "";

        container.innerHTML = `
          <nav class="breadcrumbs" aria-label="Breadcrumb">
            <a href="index.html" class="breadcrumbs__link">Головна</a>
            <span class="breadcrumbs__sep">/</span>
            <a href="products.html" class="breadcrumbs__link">Товари</a>
            <span class="breadcrumbs__sep">/</span>
            <a href="products.html?category=${product.category}" class="breadcrumbs__link">${product.categoryName}</a>
            <span class="breadcrumbs__sep">/</span>
            <span class="breadcrumbs__current">${product.title}</span>
          </nav>

          <div class="product-hero">
           <div class="product-hero__gallery">
              <div class="product-hero__main-img-wrap" id="main-img-wrap">
                <img
                  src="${galleryImages[0]}"
                  alt="${product.title}"
                  class="product-hero__img"
                  id="main-product-img"
                />
              </div>
              ${thumbsHtml}
            </div>

            <div class="product-hero__info">
              <!-- Top Group (Badges + Title) -->
              <div class="product-hero__top-content" style="display: flex; flex-direction: column; gap: 12px;">
                <div class="product-hero__badges">
                  <span class="badge ${product.inStock ? "badge--instock" : "badge--outstock"}">
                    ${product.stockText}
                  </span>
                  <span class="badge badge--terms">${product.saleTerms}</span>
                </div>

                <h1 class="product-hero__title">${product.title}</h1>
              </div>

              <!-- Bottom Group (Price Box) -->
              <div class="product-hero__price-box">
                <div class="product-hero__price-row">
                  <span class="product-hero__price">${product.price}</span>
                  <span class="product-hero__vat">${product.vatNote}</span>
                </div>
                ${product.minOrder ? `<div class="product-hero__min-order">${product.minOrder}</div>` : ""}

                <button type="button" class="wholesale-toggle" id="wholesale-btn">
                  Показати оптові ціни
                </button>
                <div class="wholesale-box" id="wholesale-box">
                  Для уточнення індивідуальних оптових цін залежно від обсягу партії зв'яжіться з відділом продажу: <strong>+380 (50) 444-33-55</strong> або <strong>astelkom@gmail.com</strong>.
                </div>

                <div class="product-hero__actions">
                  <div class="product-detail-qty">
                    <button type="button" class="product-detail-qty__btn" id="qty-dec" disabled aria-label="Зменшити">−</button>
                    <input type="number" class="product-detail-qty__input" id="qty-input" value="10" min="10" aria-label="Кількість" />
                    <button type="button" class="product-detail-qty__btn" id="qty-inc" aria-label="Збільшити">+</button>
                  </div>
                  <button type="button" class="btn-primary" id="add-to-cart-btn" style="flex: 1;">
                    Додати в кошик
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="product-sections">
            <section class="product-section">
              <h2 class="product-section__title">Опис</h2>
              <div class="product-description">
                ${descriptionHtml}
              </div>
            </section>
            ${techSpecsSection}
            ${generalSpecsSection}
            ${docsSection}
          </div>
        `;

        // --- Clean Gallery & Lightbox Script ---
        const mainImg = document.getElementById("main-product-img");
        const mainImgWrap = document.getElementById("main-img-wrap");
        const thumbButtons = document.querySelectorAll(
          ".product-hero__thumb-btn",
        );

        const lightbox = document.getElementById("product-lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        const lightboxClose = document.getElementById("lightbox-close");
        const lightboxPrev = document.getElementById("lightbox-prev");
        const lightboxNext = document.getElementById("lightbox-next");
        const lightboxCounter = document.getElementById("lightbox-counter");

        let currentImageIndex = 0;

        function setActiveImage(index) {
          if (!galleryImages || galleryImages.length === 0) return;
          currentImageIndex =
            (index + galleryImages.length) % galleryImages.length;
          const activeSrc = galleryImages[currentImageIndex];

          if (mainImg) mainImg.setAttribute("src", activeSrc);
          if (lightboxImg) lightboxImg.setAttribute("src", activeSrc);
          if (lightboxCounter) {
            lightboxCounter.textContent = `${currentImageIndex + 1} / ${galleryImages.length}`;
          }

          thumbButtons.forEach((btn, idx) => {
            btn.classList.toggle("is-active", idx === currentImageIndex);
          });

          const hasMultiple = galleryImages.length > 1;
          if (lightboxPrev)
            lightboxPrev.style.display = hasMultiple ? "flex" : "none";
          if (lightboxNext)
            lightboxNext.style.display = hasMultiple ? "flex" : "none";
          if (lightboxCounter)
            lightboxCounter.style.display = hasMultiple ? "block" : "none";
        }

        setActiveImage(0);

        thumbButtons.forEach((btn, idx) => {
          btn.addEventListener("click", () => setActiveImage(idx));
        });

        if (mainImgWrap && lightbox) {
          mainImgWrap.addEventListener("click", () => {
            setActiveImage(currentImageIndex);
            lightbox.classList.add("is-open");
            document.body.style.overflow = "hidden";
          });

          const closeLightbox = () => {
            lightbox.classList.remove("is-open");
            document.body.style.overflow = "";
          };

          lightboxClose.addEventListener("click", closeLightbox);
          lightboxPrev.addEventListener("click", (e) => {
            e.stopPropagation();
            setActiveImage(currentImageIndex - 1);
          });
          lightboxNext.addEventListener("click", (e) => {
            e.stopPropagation();
            setActiveImage(currentImageIndex + 1);
          });

          lightbox.addEventListener("click", (e) => {
            if (
              e.target === lightbox ||
              e.target.classList.contains("product-lightbox__content")
            ) {
              closeLightbox();
            }
          });

          document.addEventListener("keydown", (e) => {
            if (!lightbox.classList.contains("is-open")) return;
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowLeft") setActiveImage(currentImageIndex - 1);
            if (e.key === "ArrowRight") setActiveImage(currentImageIndex + 1);
          });
        }
        // Wholesale Toggle Logic
        const wholesaleBtn = document.getElementById("wholesale-btn");
        const wholesaleBox = document.getElementById("wholesale-box");
        if (wholesaleBtn && wholesaleBox) {
          wholesaleBtn.addEventListener("click", () => {
            const isOpen = wholesaleBox.classList.toggle("is-open");
            wholesaleBtn.textContent = isOpen
              ? "Приховати оптові ціни"
              : "Показати оптові ціни";
          });
        }

        // --- Quantity Selector & Add to Cart Logic ---
        const minQty = CartManager.getMinQty(product.id);
        const qtyInput = document.getElementById("qty-input");
        const decBtn = document.getElementById("qty-dec");
        const incBtn = document.getElementById("qty-inc");
        const addToCartBtn = document.getElementById("add-to-cart-btn");

        if (product.inStock === false) {
          addToCartBtn.disabled = true;
          addToCartBtn.textContent = "Немає в наявності";

          document.querySelector(".product-detail-qty").style.display = "none";
        }

        qtyInput.value = minQty;
        qtyInput.min = minQty;
        decBtn.disabled = true;

        function syncDetailQty(val) {
          const cleanQty = Math.max(minQty, parseInt(val, 10) || minQty);
          qtyInput.value = cleanQty;
          decBtn.disabled = cleanQty <= minQty;
          return cleanQty;
        }

        decBtn.addEventListener("click", () => {
          syncDetailQty(parseInt(qtyInput.value, 10) - 1);
        });

        incBtn.addEventListener("click", () => {
          syncDetailQty(parseInt(qtyInput.value, 10) + 1);
        });

        qtyInput.addEventListener("change", () => {
          syncDetailQty(qtyInput.value);
        });

        if (addToCartBtn && product) {
          addToCartBtn.addEventListener("click", () => {
            const chosenQty = syncDetailQty(qtyInput.value);
            CartManager.addItem(product, chosenQty);
          });
        }
      });
    </script>

    <!-- Full-Screen Lightbox Overlay -->
    <div class="product-lightbox" id="product-lightbox">
      <button
        type="button"
        class="product-lightbox__close"
        id="lightbox-close"
        aria-label="Закрити"
      >
        ×
      </button>
      <button
        type="button"
        class="product-lightbox__arrow product-lightbox__prev"
        id="lightbox-prev"
        aria-label="Попереднє фото"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="product-lightbox__content">
        <img
          src=""
          alt="Збільшене фото товару"
          class="product-lightbox__img"
          id="lightbox-img"
        />
      </div>

      <button
        type="button"
        class="product-lightbox__arrow product-lightbox__next"
        id="lightbox-next"
        aria-label="Наступне фото"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
      <div class="product-lightbox__counter" id="lightbox-counter">1 / 1</div>
    </div>
  </body>
</html>
