<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Товар - АСТЕЛ-КОМ</title>
    <link
      rel="preload"
      href="assets/fonts/geist-v5-cyrillic_latin/geist-v5-cyrillic_latin-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/geist-v5-cyrillic_latin/geist-v5-cyrillic_latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/geist-mono-v6-cyrillic_latin/geist-mono-v6-cyrillic_latin-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/geist-mono-v6-cyrillic_latin/geist-mono-v6-cyrillic_latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/product-detail.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="container header__inner">
        <div class="header__top">
          <a href="index.html">
            <img
              src="assets/images/logo-main.svg"
              class="header__image"
              alt="АСТЕЛ-КОМ"
            />
          </a>
          <div class="header__top-controls">
            <a
              href="#"
              class="header__cart header__cart--mobile"
              aria-label="Кошик"
            >
              <img
                src="assets/images/shopping_cart.svg"
                class="cart-icon-black"
                alt="Кошик"
              />
            </a>
            <button
              class="header__toggle"
              id="menu-toggle"
              aria-label="Toggle menu"
            >
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="header__collapse" id="menu-collapse">
          <nav class="header__nav">
            <a href="index.html" class="header__link">ГОЛОВНА</a>
            <a href="about_us.html" class="header__link">ПРО НАС</a>
            <a
              href="products.html"
              class="header__link hide-on-compact header__link--active"
              >ТОВАРИ</a
            >
            <a href="downloads.html" class="header__link hide-on-compact"
              >ЗАВАНТАЖЕННЯ</a
            >
            <a href="docs.html" class="header__link hide-on-compact"
              >ДОКУМЕНТАЦІЯ</a
            >
            <a href="#footer" class="header__link">КОНТАКТИ</a>

            <div
              class="header__more show-on-compact header__link--active"
              id="header-more-dropdown"
            >
              <button
                class="header__link header__more-trigger"
                id="more-toggle"
              >
                БІЛЬШЕ
                <svg
                  class="header__more-icon"
                  width="12"
                  height="12"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M6 9l6 6 6-6" />
                </svg>
              </button>
              <div class="header__more-menu">
                <a
                  href="products.html"
                  class="header__more-link header__more-link--active"
                  >ТОВАРИ</a
                >
                <a href="downloads.html" class="header__more-link"
                  >ЗАВАНТАЖЕННЯ</a
                >
                <a href="docs.html" class="header__more-link">ДОКУМЕНТАЦІЯ</a>
              </div>
            </div>
          </nav>

          <div class="header__utils">
            <div class="header__lang">
              <div class="header__lang-trigger">
                UA
                <svg
                  class="header__lang-icon"
                  width="12"
                  height="12"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M6 9l6 6 6-6" />
                </svg>
              </div>
              <ul class="header__lang-menu">
                <li class="header__lang-item">
                  <a href="#" class="header__lang-link">UA</a>
                </li>
                <li class="header__lang-item">
                  <a href="#" class="header__lang-link">EN</a>
                </li>
              </ul>
            </div>

            <a
              href="#"
              class="header__cart header__cart--desktop"
              aria-label="Кошик"
            >
              <img
                src="assets/images/shopping_cart.svg"
                class="cart-icon-black"
                alt="Кошик"
              />
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- MAIN DYNAMIC PRODUCT CONTAINER -->
    <main class="product-page">
      <div class="container" id="product-container">
        <!-- Populated dynamically via JS -->
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer" id="footer">
      <div class="container footer__container">
        <div class="footer__contacts">
          <div class="footer__item">
            <img
              src="assets/images/enterprise.svg"
              alt="Company"
              class="footer__icon"
            />
            <span class="footer__text">Компанія ТОВ "АСТЕЛ-КОМ"</span>
          </div>
          <div class="footer__item">
            <img
              src="assets/images/person.svg"
              alt="Contact Person"
              class="footer__icon"
            />
            <span class="footer__text">Сергій +380504443355</span>
          </div>
          <div class="footer__item">
            <img
              src="assets/images/location.svg"
              alt="Location"
              class="footer__icon"
            />
            <span class="footer__text"
              >вул. Солом'янська, 5, Київ, Україна</span
            >
          </div>
          <div class="footer__item footer__item--align-top">
            <img
              src="assets/images/phone.svg"
              alt="Phone"
              class="footer__icon"
            />
            <div class="footer__text-group">
              <a href="tel:+380504443355" class="footer__link"
                >+380 (50) 444-33-55</a
              >
              <a href="tel:+380443039551" class="footer__link"
                >+380 (44) 303-95-51</a
              >
            </div>
          </div>
          <div class="footer__item">
            <img
              src="assets/images/mail.svg"
              alt="Email"
              class="footer__icon"
            />
            <a href="mailto:astelkom@gmail.com" class="footer__link"
              >astelkom@gmail.com</a
            >
          </div>
        </div>

        <div class="footer__map">
          <a href="https://www.google.com/maps/place/..." target="_blank">
            <picture>
              <source
                media="(min-width: 1440px)"
                srcset="assets/images/map-wide.png"
              />
              <source
                media="(min-width: 1024px)"
                srcset="assets/images/map.png"
              />
              <source
                media="(min-width: 500px)"
                srcset="assets/images/map-tablet.png"
              />
              <img
                src="assets/images/map-mobile.png"
                alt="Карта проїзду"
                class="footer__map-image"
              />
            </picture>
          </a>
        </div>
      </div>
    </footer>

    <script src="js/products-data.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Mobile Menu Logic
        const toggleBtn = document.getElementById("menu-toggle");
        const collapseMenu = document.getElementById("menu-collapse");
        if (toggleBtn && collapseMenu) {
          toggleBtn.addEventListener("click", () => {
            collapseMenu.classList.toggle("header__collapse--open");
          });
        }

        // Render Dynamic Product
        const params = new URLSearchParams(window.location.search);
        const productId = params.get("id") || "com-900-485";
        const product = PRODUCTS_DATA[productId];
        const container = document.getElementById("product-container");

        if (!product) {
          container.innerHTML = `
            <div class="product-section" style="text-align: center; padding: 60px 24px;">
              <h1 class="product-hero__title" style="margin-bottom: 16px;">Товар не знайдено</h1>
              <p style="margin-bottom: 24px; color: #6b7280;">Перевірте посилання або поверніться до каталогу товарів.</p>
              <a href="products.html" class="btn-primary" style="max-width: 280px;">До каталогу</a>
            </div>
          `;
          return;
        }

        document.getElementById("page-title").textContent =
          `${product.title} — АСТЕЛ-КОМ`;

        const renderTableRows = (rows) =>
          rows
            .map(
              (r) => `
              <tr>
                <th>${r.label}</th>
                <td>${r.value}</td>
              </tr>`,
            )
            .join("");

        const descriptionHtml = product.description
          .map((p) => `<p>${p}</p>`)
          .join("");

        const techSpecsSection =
          product.techSpecs && product.techSpecs.length
            ? `
          <section class="product-section">
            <h2 class="product-section__title">Технічні характеристики</h2>
            <table class="specs-table">
              <tbody>${renderTableRows(product.techSpecs)}</tbody>
            </table>
          </section>`
            : "";

        const generalSpecsSection =
          product.generalSpecs && product.generalSpecs.length
            ? `
          <section class="product-section">
            <h2 class="product-section__title">Основні характеристики</h2>
            <table class="specs-table">
              <tbody>${renderTableRows(product.generalSpecs)}</tbody>
            </table>
          </section>`
            : "";

        const docsSection =
          product.docs && product.docs.length
            ? `
          <section class="product-section">
            <h2 class="product-section__title">Специфікації та документація</h2>
            <div class="docs-list">
              ${product.docs
                .map(
                  (d) => `
                <a href="${d.url}" ${d.download ? `download="${d.download}"` : 'target="_blank" rel="noopener"'} class="doc-item">
                  <div class="doc-item__left">
                    <img src="assets/images/file_save.svg" alt="Завантажити" class="doc-item__icon" />
                    <span>${d.title}</span>
                  </div>
                  <span style="font-family: var(--font-mono); font-size: 13px; font-weight: 700;">${d.download ? "PDF" : "DRIVE"}</span>
                </a>`,
                )
                .join("")}
            </div>
          </section>`
            : "";

        container.innerHTML = `
          <nav class="breadcrumbs" aria-label="Breadcrumb">
            <a href="index.html" class="breadcrumbs__link">Головна</a>
            <span class="breadcrumbs__sep">/</span>
            <a href="products.html" class="breadcrumbs__link">Товари</a>
            <span class="breadcrumbs__sep">/</span>
            <a href="products.html?category=${product.category}" class="breadcrumbs__link">${product.categoryName}</a>
            <span class="breadcrumbs__sep">/</span>
            <span class="breadcrumbs__current">${product.title}</span>
          </nav>

          <div class="product-hero">
            <div class="product-hero__gallery">
              <img src="${product.image}" alt="${product.title}" class="product-hero__img" />
            </div>

            <div class="product-hero__info">
              <div class="product-hero__badges">
                <span class="badge ${product.inStock ? "badge--instock" : "badge--outstock"}">
                  ${product.stockText}
                </span>
                <span class="badge badge--terms">${product.saleTerms}</span>
              </div>

              <h1 class="product-hero__title">${product.title}</h1>

              <div class="product-hero__price-box">
                <div class="product-hero__price-row">
                  <span class="product-hero__price">${product.price}</span>
                  <span class="product-hero__vat">${product.vatNote}</span>
                </div>
                ${product.minOrder ? `<div class="product-hero__min-order">${product.minOrder}</div>` : ""}

                <button type="button" class="wholesale-toggle" id="wholesale-btn">
                  Показати оптові ціни ↓
                </button>
                <div class="wholesale-box" id="wholesale-box">
                  Для уточнення індивідуальних оптових цін залежно від обсягу партії зв'яжіться з відділом продажу: <strong>+380 (50) 444-33-55</strong> або <strong>astelkom@gmail.com</strong>.
                </div>

                <div class="product-hero__actions">
                  <button type="button" class="btn-primary">
                    Замовити / Додати в кошик
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="product-sections">
            <section class="product-section">
              <h2 class="product-section__title">Опис</h2>
              <div class="product-description">
                ${descriptionHtml}
              </div>
            </section>
            ${techSpecsSection}
            ${generalSpecsSection}
            ${docsSection}
          </div>
        `;

        const wholesaleBtn = document.getElementById("wholesale-btn");
        const wholesaleBox = document.getElementById("wholesale-box");
        if (wholesaleBtn && wholesaleBox) {
          wholesaleBtn.addEventListener("click", () => {
            wholesaleBox.classList.toggle("is-open");
          });
        }
      });
    </script>
  </body>
</html>
