    <script src="js/products-data.js"></script>
    <script src="js/cart.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const container = document.getElementById("order-status-container");
        const rawOrder = localStorage.getItem("astelkom_active_order");

        if (!rawOrder) {
          container.innerHTML = `
            <div class="order-status-card" style="text-align: center;">
              <h1 class="order-status__title">Активне замовлення не знайдено</h1>
              <p class="order-status__lead">Ви ще не оформили замовлення або перейшли за застарілим посиланням.</p>
              <a href="products.html" class="submit-btn" style="max-width: 280px; margin: 0 auto; text-decoration: none;">
                Перейти до каталогу
              </a>
            </div>
          `;
          return;
        }

        const order = JSON.parse(rawOrder);
        const totalDuration = 15 * 60 * 1000;

        const itemsHtml = order.items
          .map(
            (item) => `
            <div class="cart-item">
              <div class="cart-item__img-wrap">
                <img src="${item.image}" alt="${item.title}" class="cart-item__img" />
              </div>
              <div class="cart-item__details">
                <span class="cart-item__title">${item.title}</span>
                <span class="cart-item__price">${item.qty} шт. × ${CartManager.formatPrice(item.price)}</span>
              </div>
              <div class="cart-item__sum">${CartManager.formatPrice(item.price * item.qty)}</div>
            </div>
          `,
          )
          .join("");

        container.innerHTML = `
          <div class="order-status-card">
            <div class="order-status__top">
              <span class="order-status__badge" id="status-badge">Прийнято (доступне редагування)</span>
              <span class="order-status__id">Замовлення #${order.orderId}</span>
            </div>

            <div>
              <h1 class="order-status__title" style="margin-bottom: 10px;">
                Дякуємо за замовлення, ${order.customer.firstName} ${order.customer.lastName}!
              </h1>
              <p class="order-status__lead">
                Підтвердження відправлено на <strong>${order.customer.email}</strong>. Наш менеджер зв'яжеться з вами найближчим часом.
              </p>
            </div>

            <!-- Countdown Timer -->
            <div class="timer-box" id="timer-box">
              <div class="timer-box__row">
                <span class="timer-box__label" id="timer-label">
                  Час для внесення змін у замовлення або кошик:
                </span>
                <span class="timer-box__clock" id="timer-clock">15:00</span>
              </div>
              <div class="timer-box__progress-bg">
                <div class="timer-box__progress-bar" id="timer-progress"></div>
              </div>
            </div>

            <!-- Order Details Grid -->
            <div class="order-details-grid">
              <div class="order-detail-block">
                <span class="order-detail-block__label">Отримувач</span>
                <span class="order-detail-block__value">
                  ${order.customer.firstName} ${order.customer.lastName}
                  ${order.customer.phone ? `<br><span style="font-weight: 400; color: #4b5563;">${order.customer.phone}</span>` : ""}
                </span>
              </div>

              <div class="order-detail-block">
                <span class="order-detail-block__label">Сума та спосіб оплати</span>
                <span class="order-detail-block__value">
                  ${CartManager.formatPrice(order.subtotal)} (без ПДВ)<br>
                  <span style="font-weight: 400; color: #4b5563;">${order.payment}</span>
                </span>
              </div>

              <div class="order-detail-block" style="grid-column: 1 / -1;">
                <span class="order-detail-block__label">Доставка</span>
                <span class="order-detail-block__value">
                  ${order.delivery.carrierName} (${order.delivery.type}: ${order.delivery.branch}, м. ${order.delivery.city})
                </span>
              </div>
            </div>

            <!-- Ordered Items -->
            <div>
              <h2 class="checkout-panel__heading" style="font-size: 15px; margin-bottom: 16px;">
                Склад замовлення
              </h2>
              <div class="cart-items">
                ${itemsHtml}
              </div>
            </div>

            <!-- Actions -->
            <div class="order-actions">
              <button type="button" class="btn-outline" id="edit-order-btn">
                Редагувати дані або товари
              </button>
              <button type="button" class="submit-btn" id="lock-order-btn" style="margin-top: 0;">
                Все вірно, передати в роботу зараз
              </button>
            </div>
          </div>
        `;

        const timerBox = document.getElementById("timer-box");
        const timerLabel = document.getElementById("timer-label");
        const timerClock = document.getElementById("timer-clock");
        const timerProgress = document.getElementById("timer-progress");
        const statusBadge = document.getElementById("status-badge");
        const editBtn = document.getElementById("edit-order-btn");
        const lockBtn = document.getElementById("lock-order-btn");

        function lockOrderUI() {
          order.locked = true;
          order.expiresAt = Date.now() - 1000;
          localStorage.setItem("astelkom_active_order", JSON.stringify(order));

          timerBox.classList.add("is-locked");
          timerClock.textContent = "00:00";
          timerProgress.style.width = "0%";
          timerLabel.textContent =
            "Замовлення передано в обробку менеджеру. Редагування завершено.";
          statusBadge.textContent = "Передано в обробку";
          editBtn.disabled = true;
          lockBtn.textContent = "Повернутися до каталогу";
        }

        const interval = setInterval(() => {
          if (order.locked) {
            clearInterval(interval);
            lockOrderUI();
            return;
          }

          const remaining = order.expiresAt - Date.now();
          if (remaining <= 0) {
            clearInterval(interval);
            lockOrderUI();
            return;
          }

          const mins = String(Math.floor(remaining / 60000)).padStart(2, "0");
          const secs = String(Math.floor((remaining % 60000) / 1000)).padStart(
            2,
            "0",
          );
          timerClock.textContent = `${mins}:${secs}`;
          const pct = Math.max(
            0,
            Math.min(100, (remaining / totalDuration) * 100),
          );
          timerProgress.style.width = `${pct}%`;
        }, 250);

        // Edit Order Button -> Restore items into CartManager and redirect to cart.html?edit=true
        editBtn.addEventListener("click", () => {
          if (order.locked || Date.now() >= order.expiresAt) return;
          CartManager.saveCart(order.items);
          window.location.href = "cart.html?edit=true";
        });

        // Lock Immediately / Return to Catalog Button
        lockBtn.addEventListener("click", () => {
          if (order.locked || Date.now() >= order.expiresAt) {
            window.location.href = "products.html";
          } else {
            lockOrderUI();
          }
        });
      });
    </script>
    <script>
      // --- Auto-Send / Finalize Order if User Exits Page Mid-Timer ---
      function finalizeOrderOnExit() {
        const raw = localStorage.getItem("astelkom_active_order");
        if (!raw) return;

        try {
          const order = JSON.parse(raw);
          if (!order.locked && Date.now() < order.expiresAt) {
            // Mark order as locked/finalized
            order.locked = true;
            localStorage.setItem(
              "astelkom_active_order",
              JSON.stringify(order),
            );

            // WHEN YOU CONNECT YOUR BACKEND:
            // Use navigator.sendBeacon() to reliably send data to your server
            // even as the browser tab is closing:
            /*
              navigator.sendBeacon(
                "https://api.astelkom.com/orders/finalize", 
                JSON.stringify(order)
              );
              */

            // For now, you can also store it into a "completed_orders" list in localStorage
            // so your admin/manager dashboard can see it immediately:
            const history = JSON.parse(
              localStorage.getItem("astelkom_completed_orders") || "[]",
            );
            history.push({
              ...order,
              finalizedAt: Date.now(),
              exitMethod: "navigated_away",
            });
            localStorage.setItem(
              "astelkom_completed_orders",
              JSON.stringify(history),
            );
          }
        } catch (e) {}
      }

      // Triggered when user switches tabs, minimizes window, or closes the tab
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          finalizeOrderOnExit();
        }
      });

      // Triggered right before the page unloads
      window.addEventListener("beforeunload", () => {
        finalizeOrderOnExit();
      });
    </script>
  </body>
